[build-system]
requires = ["uv_build>=0.9.30"]
build-backend = "uv_build"

[project]
name = "unofficial-api-for-tnaflix"
version = "1.0.1"
description = "An asynchronous Python API Wrapper and Scraper for tnaflix.com"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Johannes Habel", email = "EchterAlsFake@proton.me" }
]

keywords = [
    "api",
    "scraper",
    "async",
    "asyncio",
    "video-downloader",
    "selectolax",
    "curl-cffi",
    "tnaflix"
]

dependencies = [
    "selectolax",
    "eaf-base-api>=4.2.5",
    "curl-cffi",
    "m3u8",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Video"
]

[project.optional-dependencies]
av = ["av"]

[project.urls]
Homepage = "https://github.com/EchterAlsFake/unofficial-api-for-tnaflix"
Repository = "https://github.com/EchterAlsFake/unofficial-api-for-tnaflix"
"Bug Tracker" = "https://github.com/EchterAlsFake/unofficial-api-for-tnaflix/issues"
"Support me on Ko-Fi" = "https://ko-fi.com/EchterAlsFake"
"Donate via PayPal" = "https://paypal.me/EchterAlsFake"
"Donate via Crypto" = "https://nowpayments.io/donation/EchterAlsFake"

[project.scripts]
tnaflix_api = "tnaflix_api.api:main"


[tool.uv.build-backend]
module-name = "tnaflix_api"
module-root = ""
